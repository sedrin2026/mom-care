<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>朝のチェック</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family:
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #fffafb 0%,
      #fffdfb 55%,
      #fffaf7 100%
    );

  color: #632b18;
}


/* =====================================================
   APP
===================================================== */

.app {
  width: 100%;
  height: 100dvh;

  display: flex;
  justify-content: center;

  overflow: hidden;

  padding:
    env(safe-area-inset-top)
    8px
    env(safe-area-inset-bottom)
    8px;
}

.phone {
  width: 100%;
  max-width: 480px;
  height: 100%;

  overflow: hidden;
}


/* =====================================================
   HOME
===================================================== */

#homeScreen {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
  height: 7%;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  padding: 0 10px;
}


/* ① 家アイコンを一回り小さく */

.home-icon {
  position: absolute;
  left: 9px;

  font-size: clamp(31px, 8vw, 43px);

  line-height: 1;
}


/* ② 朝のチェックを中央 */

.title {
  font-size: clamp(25px, 7vw, 36px);

  font-weight: 1000;

  letter-spacing: -1px;

  text-align: center;

  white-space: nowrap;
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.home-content {
  height: 93%;

  display: flex;
  flex-direction: column;

  justify-content: space-between;

  overflow: hidden;

  padding:
    0
    14px
    5px;
}


/* =====================================================
   PHOTO
===================================================== */

.photo-wrap {
  width: 100%;
  height: 22.5%;

  flex-shrink: 0;

  padding: 4px;

  border-radius: 34px;

  background:
    linear-gradient(
      135deg,
      #ffcee0,
      #fff,
      #ffc9dc
    );

  box-shadow:
    0 3px 8px rgba(255, 120, 160, .18);
}

.photo {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  border-radius: 29px;

  background:
    linear-gradient(
      135deg,
      #ccecf5,
      #edf7d4
    );
}


/* =====================================================
   GREETING BANNER
===================================================== */

.greeting {
  width: 100%;
  height: 21%;

  flex-shrink: 0;

  margin-top: 1.1%;

  border-radius: 34px;

  border: 4px solid #ffb3ce;

  background:
    linear-gradient(
      180deg,
      #fffafb 0%,
      #fff2f7 100%
    );

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  overflow: hidden;

  box-shadow:
    inset 0 0 0 2px #ffe2ec,
    0 5px 10px rgba(255, 113, 158, .13);

  position: relative;
}


/* =====================================================
   桜
===================================================== */

.sakura {
  position: absolute;

  width: 55px;
  height: 55px;

  opacity: .24;

  pointer-events: none;
}

.sakura-left {
  left: 14px;
  top: 14px;
}

.sakura-right {
  right: 14px;
  top: 14px;
}

.sakura-bottom-left {
  left: 25px;
  bottom: 12px;

  transform: scale(.72);

  opacity: .18;
}

.sakura-bottom-right {
  right: 25px;
  bottom: 12px;

  transform: scale(.72);

  opacity: .18;
}


/* =====================================================
   GREETING TEXT
   ★ 重要：
   「おはよう！」と「〇〇〇だよ！」を
   完全に同一サイズに固定
===================================================== */

.greeting-line {
  display: block;

  width: 100%;

  color: #f31f5d;

  font-weight: 1000;

  /*
    ここを2行共通で指定
    !importantで個別指定による上書きを防止
  */
  font-size: clamp(46px, 13vw, 70px) !important;

  line-height: 0.95;

  text-align: center;

  white-space: nowrap;

  text-shadow:
    0 3px 0 #ffffff,
    0 5px 8px rgba(210, 50, 90, .12);

  z-index: 2;
}


/*
  2行を完全に同じ指定
*/

.greeting-line:first-child,
.greeting-line:last-child {
  font-size: clamp(46px, 13vw, 70px) !important;
}


/* =====================================================
   DATE
===================================================== */

.date-box {
  width: 100%;
  height: 11.5%;

  flex-shrink: 0;

  margin-top: 1%;

  border-radius: 29px;

  border: 4px solid #ffe1b0;

  background: #fffdfa;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 10px;

  box-shadow:
    0 4px 10px rgba(180, 130, 70, .07);

  overflow: hidden;
}


/* カレンダー削除 */

.calendar-icon {
  display: none;
}


/* 日時中央 */

.date-text {
  width: 100%;

  text-align: center;

  font-size: clamp(29px, 8.2vw, 43px);

  font-weight: 1000;

  letter-spacing: -1px;

  white-space: nowrap;

  line-height: 1;

  overflow: hidden;
}


/* =====================================================
   WEATHER
===================================================== */

.weather-box {
  width: 100%;
  height: 15.5%;

  flex-shrink: 0;

  margin-top: 1%;

  border-radius: 30px;

  border: 4px solid #ffe2b4;

  background: #fffefa;

  display: flex;
  align-items: center;

  padding: 4px 10px;

  overflow: hidden;
}


/* 今日の / 天気は */

.weather-label {
  width: 28%;

  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  font-size: clamp(21px, 5.8vw, 30px);

  font-weight: 1000;

  line-height: 1.08;

  flex-shrink: 0;
}


/* 晴れ＋太陽 */

.weather-result {
  flex: 1;

  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 7px;

  white-space: nowrap;
}


/* 晴れ */

.weather-big {
  color: #168be8;

  font-size: clamp(48px, 13vw, 70px);

  font-weight: 1000;

  line-height: 1;

  text-shadow:
    0 3px 0 #ffffff;
}


/* 太陽 */

.weather-sun {
  font-size: clamp(45px, 12vw, 66px);

  line-height: 1;

  display: flex;

  align-items: center;
}


/* =====================================================
   MESSAGE
===================================================== */

.encourage {
  width: 100%;
  height: 12.5%;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  position: relative;

  font-size: clamp(23px, 6.5vw, 34px);

  line-height: 1.15;

  font-weight: 1000;
}


/* =====================================================
   START BUTTON
===================================================== */

.start-button {
  width: 100%;
  height: 13.5%;

  flex-shrink: 0;

  border-radius: 50px;

  border: 4px solid #ff5c91;

  background:
    linear-gradient(
      180deg,
      #ff79a5 0%,
      #ff2765 100%
    );

  color: white;

  font-size: clamp(36px, 10vw, 52px);

  font-weight: 1000;

  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    0 8px 16px rgba(255, 48, 100, .25);

  text-shadow:
    0 3px 3px rgba(180, 20, 65, .25);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0;

  gap: 0;
}

.start-button:active {
  transform: scale(.98);
}


/* =====================================================
   QUESTION SCREEN
===================================================== */

#questionScreen {
  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.question-card {
  width: 100%;
  height: 100%;

  border-radius: 30px;

  border: 3px solid #ffc9dc;

  background:
    linear-gradient(
      180deg,
      #fffafd,
      #ffffff
    );

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 5%;

  overflow: hidden;
}

.question-icon {
  font-size: clamp(65px, 19vw, 95px);

  line-height: 1;
}

.question-text {
  width: 100%;

  margin: 4% 0;

  text-align: center;

  font-size: clamp(34px, 9vw, 46px);

  font-weight: 1000;

  line-height: 1.25;
}

.answer {
  width: 100%;
  height: 17%;

  margin-top: 3%;

  border-radius: 50px;

  color: white;

  font-size: clamp(30px, 8vw, 40px);

  font-weight: 1000;

  box-shadow:
    0 6px 12px rgba(0,0,0,.12);
}

.answer:active {
  transform: scale(.98);
}

.yes {
  background:
    linear-gradient(
      135deg,
      #ff7193,
      #f83d6e
    );
}

.no {
  background:
    linear-gradient(
      135deg,
      #5bb7f7,
      #328fe0
    );
}


/* =====================================================
   COMPLETE
===================================================== */

#thanksScreen {
  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.thanks-card {
  width: 100%;

  padding: 35px 15px;

  border-radius: 30px;

  border: 3px solid #ffd0df;

  background: #fffafd;

  text-align: center;
}

.thanks-title {
  font-size: clamp(38px, 11vw, 52px);

  font-weight: 1000;

  color: #ef4f78;
}

.thanks-text {
  margin-top: 15px;

  font-size: clamp(20px, 6vw, 28px);

  line-height: 1.5;

  font-weight: 900;
}


/* =====================================================
   SMALL HEIGHT
===================================================== */

@media (max-height: 720px) {

  .topbar {
    height: 6.5%;
  }

  .home-content {
    height: 93.5%;
  }

  .photo-wrap {
    height: 21%;
  }

  .greeting {
    height: 20%;
  }


  /* ★ ここも2行完全同一 */

  .greeting-line:first-child,
  .greeting-line:last-child,
  .greeting-line {
    font-size: clamp(42px, 12vw, 62px) !important;
  }


  .date-box {
    height: 11%;
  }

  .weather-box {
    height: 15%;
  }

  .encourage {
    height: 11.5%;

    font-size:
      clamp(20px, 5.5vw, 27px);
  }

  .start-button {
    height: 13%;

    font-size:
      clamp(32px, 9vw, 42px);
  }
}


/* =====================================================
   VERY SMALL HEIGHT
===================================================== */

@media (max-height: 620px) {

  .photo-wrap {
    height: 19%;
  }

  .greeting {
    height: 19%;
  }


  /* ★ 最小画面でも完全同一 */

  .greeting-line:first-child,
  .greeting-line:last-child,
  .greeting-line {
    font-size: 36px !important;
  }


  .date-box {
    height: 11%;
  }

  .date-text {
    font-size: 25px;
  }

  .weather-box {
    height: 14%;
  }

  .weather-label {
    font-size: 17px;
  }

  .weather-big {
    font-size: 43px;
  }

  .weather-sun {
    font-size: 42px;
  }

  .encourage {
    height: 10%;

    font-size: 19px;
  }

  .start-button {
    height: 13%;

    font-size: 31px;
  }
}

</style>
</head>

<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

  {
    icon: "🍚",
    text: "朝ごはん<br>食べた？"
  },

  {
    icon: "💊",
    text: "朝の薬は<br>飲んだ？"
  },

  {
    icon: "❤️",
    text: "身体どこか<br>痛いところない？"
  },

  {
    icon: "💧",
    text: "水分補給<br>してる？"
  },

  {
    icon: "🏃‍♀️",
    text: "軽く運動は<br>した？"
  },

  {
    icon: "🆘",
    text: "何か困ったこと<br>ある？"
  }

];


let currentQuestion = 0;

let answers = [];


/* =====================================================
   START
===================================================== */

function startCheck() {

  currentQuestion = 0;

  answers = [];

  document
    .getElementById("homeScreen")
    .style.display = "none";

  document
    .getElementById("questionScreen")
    .style.display = "flex";

  showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

  const q =
    questions[currentQuestion];

  document
    .getElementById("questionIcon")
    .textContent =
    q.icon;

  document
    .getElementById("questionText")
    .innerHTML =
    q.text;

}


/* =====================================================
   ANSWER
===================================================== */

function answer(value) {

  answers.push({

    question:
      questions[currentQuestion]
        .text
        .replace(/<br>/g, " "),

    answer: value

  });


  currentQuestion++;


  if (
    currentQuestion >=
    questions.length
  ) {

    document
      .getElementById("questionScreen")
      .style.display = "none";

    document
      .getElementById("thanksScreen")
      .style.display = "flex";

    console.log(
      "回答結果",
      answers
    );

    return;
  }


  showQuestion();

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

  const now =
    new Date();


  const month =
    now.getMonth() + 1;

  const day =
    now.getDate();

  const hour =
    String(
      now.getHours()
    ).padStart(2, "0");

  const minute =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  const weekdays = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];


  const weekday =
    weekdays[
      now.getDay()
    ];


  document
    .getElementById("dateText")
    .textContent =
    `${month}月${day}日(${weekday}) ${hour}:${minute}`;

}


updateClock();


setInterval(
  updateClock,
  1000
);

</script>
