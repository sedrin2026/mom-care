<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
>

<title>朝のチェック</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family:
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #fffafb 0%,
      #fffdfb 55%,
      #fffaf7 100%
    );

  color: #632b18;
}


/* =====================================================
   APP
===================================================== */

.app {
  width: 100%;
  height: 100dvh;

  display: flex;
  justify-content: center;

  overflow: hidden;

  padding:
    env(safe-area-inset-top)
    8px
    env(safe-area-inset-bottom)
    8px;
}

.phone {
  width: 100%;
  max-width: 480px;
  height: 100%;

  overflow: hidden;
}


/* =====================================================
   HOME
===================================================== */

#homeScreen {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
  height: 7%;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 12px 0 8px;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 12px;

  font-weight: 1000;
}

.home-icon {
  font-size: clamp(40px, 11vw, 55px);

  line-height: 1;
}

.title {
  font-size: clamp(25px, 7vw, 36px);

  font-weight: 1000;

  letter-spacing: -1px;

  white-space: nowrap;
}

.title-heart {
  color: #ff5c94;

  font-size: .8em;

  vertical-align: top;
}

.clock {
  font-size: clamp(29px, 8vw, 39px);

  font-weight: 1000;

  white-space: nowrap;
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.home-content {
  height: 93%;

  display: flex;
  flex-direction: column;

  justify-content: space-between;

  overflow: hidden;

  padding:
    0
    14px
    5px;
}


/* =====================================================
   PHOTO
===================================================== */

.photo-wrap {
  width: 100%;
  height: 22.5%;

  flex-shrink: 0;

  padding: 4px;

  border-radius: 34px;

  background:
    linear-gradient(
      135deg,
      #ffcee0,
      #fff,
      #ffc9dc
    );

  box-shadow:
    0 3px 8px rgba(255, 120, 160, .18);
}

.photo {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  border-radius: 29px;

  background:
    linear-gradient(
      135deg,
      #ccecf5,
      #edf7d4
    );
}


/* =====================================================
   GREETING BANNER
===================================================== */

.greeting {
  width: 100%;
  height: 21%;

  flex-shrink: 0;

  margin-top: 1.1%;

  border-radius: 34px;

  border: 4px solid #ffb3ce;

  background:
    linear-gradient(
      180deg,
      #fffafb 0%,
      #fff2f7 100%
    );

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  overflow: hidden;

  box-shadow:
    inset 0 0 0 2px #ffe2ec,
    0 5px 10px rgba(255, 113, 158, .13);

  position: relative;
}


/* decorative flowers */

.greeting::before {
  content: "🌸";

  position: absolute;

  left: 18px;
  top: 12px;

  font-size: 42px;
}

.greeting::after {
  content: "🌸";

  position: absolute;

  right: 18px;
  top: 12px;

  font-size: 42px;
}


.greeting-line {
  display: block;

  color: #f31f5d;

  font-weight: 1000;

  line-height: .95;

  text-shadow:
    0 3px 0 #ffffff,
    0 5px 8px rgba(210, 50, 90, .12);

  z-index: 2;
}

.greeting-line:first-child {
  font-size: clamp(48px, 14vw, 76px);
}

.greeting-line:last-child {
  font-size: clamp(46px, 13vw, 70px);

  margin-top: 5px;
}


/* =====================================================
   DATE
===================================================== */

.date-box {
  width: 100%;
  height: 11.5%;

  flex-shrink: 0;

  margin-top: 1%;

  border-radius: 29px;

  border: 4px solid #ffe1b0;

  background:
    #fffdfa;

  display: flex;
  align-items: center;

  padding: 0 14px;

  box-shadow:
    0 4px 10px rgba(180, 130, 70, .07);
}

.calendar-icon {
  width: 18%;

  text-align: center;

  font-size: clamp(42px, 12vw, 61px);
}

.date-text {
  flex: 1;

  text-align: center;

  font-size: clamp(29px, 8.2vw, 43px);

  font-weight: 1000;

  letter-spacing: -1px;

  white-space: nowrap;
}


/* =====================================================
   WEATHER
===================================================== */

.weather-box {
  width: 100%;
  height: 15.5%;

  flex-shrink: 0;

  margin-top: 1%;

  border-radius: 30px;

  border: 4px solid #ffe2b4;

  background:
    #fffefa;

  display: flex;
  align-items: center;

  padding: 4px 10px;

  overflow: hidden;
}

.sun {
  width: 28%;

  text-align: center;

  font-size: clamp(63px, 18vw, 90px);

  line-height: 1;
}

.weather-message {
  flex: 1;

  text-align: center;

  font-weight: 1000;

  line-height: 1;
}

.weather-small {
  font-size: clamp(20px, 5.5vw, 29px);
}

.weather-big {
  color: #168be8;

  font-size: clamp(48px, 13vw, 70px);

  font-weight: 1000;

  text-shadow:
    0 3px 0 #ffffff;
}

.weather-last {
  font-size: clamp(23px, 6vw, 32px);
}


/* =====================================================
   ENCOURAGEMENT
===================================================== */

.encourage {
  width: 100%;
  height: 12.5%;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  position: relative;

  font-size: clamp(23px, 6.5vw, 34px);

  line-height: 1.15;

  font-weight: 1000;
}

.encourage::before {
  content: "🌸";

  position: absolute;

  left: 0;

  font-size: 42px;
}

.encourage::after {
  content: "🌸";

  position: absolute;

  right: 0;

  font-size: 42px;
}


/* =====================================================
   START BUTTON
===================================================== */

.start-button {
  width: 100%;
  height: 13.5%;

  flex-shrink: 0;

  border-radius: 50px;

  border: 4px solid #ff5c91;

  background:
    linear-gradient(
      180deg,
      #ff79a5 0%,
      #ff2765 100%
    );

  color: white;

  font-size: clamp(36px, 10vw, 52px);

  font-weight: 1000;

  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    0 8px 16px rgba(255, 48, 100, .25);

  text-shadow:
    0 3px 3px rgba(180, 20, 65, .25);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 16px;

  padding: 0;
}

.start-button:active {
  transform: scale(.98);
}

.start-play {
  font-size: .8em;
}


/* =====================================================
   QUESTION SCREEN
===================================================== */

#questionScreen {
  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.question-card {
  width: 100%;
  height: 100%;

  border-radius: 30px;

  border: 3px solid #ffc9dc;

  background:
    linear-gradient(
      180deg,
      #fffafd,
      #ffffff
    );

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 5%;

  overflow: hidden;
}

.question-icon {
  font-size: clamp(65px, 19vw, 95px);

  line-height: 1;
}

.question-text {
  width: 100%;

  margin: 4% 0;

  text-align: center;

  font-size: clamp(34px, 9vw, 46px);

  font-weight: 1000;

  line-height: 1.25;
}

.answer {
  width: 100%;
  height: 17%;

  margin-top: 3%;

  border-radius: 50px;

  color: white;

  font-size: clamp(30px, 8vw, 40px);

  font-weight: 1000;

  box-shadow:
    0 6px 12px rgba(0,0,0,.12);
}

.answer:active {
  transform: scale(.98);
}

.yes {
  background:
    linear-gradient(
      135deg,
      #ff7193,
      #f83d6e
    );
}

.no {
  background:
    linear-gradient(
      135deg,
      #5bb7f7,
      #328fe0
    );
}


/* =====================================================
   COMPLETE
===================================================== */

#thanksScreen {
  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.thanks-card {
  width: 100%;

  padding: 35px 15px;

  border-radius: 30px;

  border: 3px solid #ffd0df;

  background: #fffafd;

  text-align: center;
}

.thanks-title {
  font-size: clamp(38px, 11vw, 52px);

  font-weight: 1000;

  color: #ef4f78;
}

.thanks-text {
  margin-top: 15px;

  font-size: clamp(20px, 6vw, 28px);

  line-height: 1.5;

  font-weight: 900;
}


/* =====================================================
   SMALL HEIGHT DEVICES
===================================================== */

@media (max-height: 720px) {

  .topbar {
    height: 6.5%;
  }

  .home-content {
    height: 93.5%;
  }

  .photo-wrap {
    height: 21%;
  }

  .greeting {
    height: 20%;
  }

  .greeting-line:first-child {
    font-size: clamp(42px, 12vw, 62px);
  }

  .greeting-line:last-child {
    font-size: clamp(40px, 11.5vw, 59px);
  }

  .date-box {
    height: 11%;
  }

  .weather-box {
    height: 15%;
  }

  .encourage {
    height: 11.5%;
    font-size: clamp(20px, 5.5vw, 27px);
  }

  .start-button {
    height: 13%;
    font-size: clamp(32px, 9vw, 42px);
  }
}


/* =====================================================
   VERY SMALL HEIGHT
===================================================== */

@media (max-height: 620px) {

  .photo-wrap {
    height: 19%;
  }

  .greeting {
    height: 19%;
  }

  .greeting-line:first-child {
    font-size: 36px;
  }

  .greeting-line:last-child {
    font-size: 35px;
  }

  .date-box {
    height: 11%;
  }

  .date-text {
    font-size: 25px;
  }

  .weather-box {
    height: 14%;
  }

  .sun {
    font-size: 55px;
  }

  .weather-small {
    font-size: 17px;
  }

  .weather-big {
    font-size: 43px;
  }

  .weather-last {
    font-size: 19px;
  }

  .encourage {
    height: 10%;
    font-size: 19px;
  }

  .start-button {
    height: 13%;
    font-size: 31px;
  }
}

</style>
</head>


<body>

<div class="app">

<div class="phone">


<!-- =====================================================
     HOME
===================================================== -->

<div id="homeScreen">


  <!-- TOP -->

  <div class="topbar">

    <div class="top-left">

      <div class="home-icon">
        🏠
      </div>

      <div class="title">
        朝のチェック
        <span class="title-heart">♥</span>
      </div>

    </div>


    <div
      class="clock"
      id="headerTime">

      8:00

    </div>

  </div>


  <!-- CONTENT -->

  <div class="home-content">


    <!-- =================================================
         PHOTO
    ================================================== -->

    <div class="photo-wrap">

      <!--
        ここを後で自分の写真に変更

        例：
        src="mom-check-photo.jpg"
      -->

      <img
        class="photo"
        src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1000"
        alt="写真">

    </div>


    <!-- =================================================
         GREETING
    ================================================== -->

    <div class="greeting">

      <span class="greeting-line">
        おはよう！
      </span>

      <span class="greeting-line">
        〇〇〇だよ！
      </span>

    </div>


    <!-- =================================================
         DATE
    ================================================== -->

    <div class="date-box">

      <div class="calendar-icon">
        📅
      </div>

      <div
        class="date-text"
        id="dateText">

        9月14日(日) 8:00

      </div>

    </div>


    <!-- =================================================
         WEATHER
    ================================================== -->

    <div class="weather-box">

      <div class="sun">
        ☀️
      </div>

      <div class="weather-message">

        <div class="weather-small">
          今日の天気は
        </div>

        <div class="weather-big">
          晴れ
        </div>

        <div class="weather-last">
          です
        </div>

      </div>

    </div>


    <!-- =================================================
         MESSAGE
    ================================================== -->

    <div class="encourage">

      今日も元気に<br>
      過ごしましょうね ❤️

    </div>


    <!-- =================================================
         START
    ================================================== -->

    <button
      class="start-button"
      onclick="startCheck()">

      <span class="start-play">
        ▶
      </span>

      はじめる

      <span>
        ›
      </span>

    </button>


  </div>

</div>



<!-- =====================================================
     QUESTIONS
===================================================== -->

<div id="questionScreen">

  <div class="question-card">

    <div
      class="question-icon"
      id="questionIcon">

      🍚

    </div>


    <div
      class="question-text"
      id="questionText">

      朝ごはん<br>
      食べた？

    </div>


    <button
      class="answer yes"
      onclick="answer('はい')">

      😊　はい

    </button>


    <button
      class="answer no"
      onclick="answer('いいえ')">

      🙂　いいえ

    </button>

  </div>

</div>



<!-- =====================================================
     COMPLETE
===================================================== -->

<div id="thanksScreen">

  <div class="thanks-card">

    <div class="thanks-title">
      ありがとう！💕
    </div>

    <div class="thanks-text">
      回答してくれてありがとう😊<br>
      今日もゆっくり過ごしてね。
    </div>

    <div
      style="
        font-size:65px;
        margin-top:15px;
      ">

      🌷😊🌷

    </div>

  </div>

</div>


</div>
</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

  {
    icon: "🍚",
    text: "朝ごはん<br>食べた？"
  },

  {
    icon: "💊",
    text: "朝の薬は<br>飲んだ？"
  },

  {
    icon: "❤️",
    text: "身体どこか<br>痛いところない？"
  },

  {
    icon: "💧",
    text: "水分補給<br>してる？"
  },

  {
    icon: "🏃‍♀️",
    text: "軽く運動は<br>した？"
  },

  {
    icon: "🆘",
    text: "何か困ったこと<br>ある？"
  }

];


let currentQuestion = 0;

let answers = [];


/* =====================================================
   START
===================================================== */

function startCheck() {

  currentQuestion = 0;

  answers = [];


  document
    .getElementById("homeScreen")
    .style.display = "none";


  document
    .getElementById("questionScreen")
    .style.display = "flex";


  showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

  const q =
    questions[currentQuestion];


  document
    .getElementById("questionIcon")
    .textContent =
    q.icon;


  document
    .getElementById("questionText")
    .innerHTML =
    q.text;

}


/* =====================================================
   ANSWER
===================================================== */

function answer(value) {

  answers.push({

    question:
      questions[currentQuestion]
        .text
        .replace(/<br>/g, " "),

    answer: value

  });


  currentQuestion++;


  if (
    currentQuestion >=
    questions.length
  ) {

    document
      .getElementById("questionScreen")
      .style.display = "none";


    document
      .getElementById("thanksScreen")
      .style.display = "flex";


    console.log(
      "回答結果",
      answers
    );

    return;
  }


  showQuestion();

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

  const now =
    new Date();


  const month =
    now.getMonth() + 1;

  const day =
    now.getDate();

  const hour =
    String(
      now.getHours()
    ).padStart(2, "0");

  const minute =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  const weekdays = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];


  const weekday =
    weekdays[
      now.getDay()
    ];


  document
    .getElementById("headerTime")
    .textContent =
    `${hour}:${minute}`;


  document
    .getElementById("dateText")
    .textContent =
    `${month}月${day}日(${weekday}) ${hour}:${minute}`;

}


updateClock();


setInterval(
  updateClock,
  1000
);

</script>

</body>
</html>
