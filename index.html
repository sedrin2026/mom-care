```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>お母さん 朝のチェック</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background: linear-gradient(180deg, #fff5f8, #eefaff);
  color: #5b3d35;
}

/* =========================
   メイン
========================= */

.app {
  min-height: 100vh;
  padding: 16px;
  display: flex;
  justify-content: center;
}

.phone {
  width: 100%;
  max-width: 480px;
}

/* =========================
   ヘッダー
========================= */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.header-title {
  font-size: 24px;
  font-weight: 900;
}

.header-time {
  font-size: 22px;
  font-weight: 900;
}

/* =========================
   朝のウェルカム
========================= */

.welcome {
  background: linear-gradient(180deg, #fff9fb, #fff);
  border-radius: 30px;
  padding: 22px 18px 18px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(100, 80, 80, .12);
  border: 2px solid #ffd8e3;
  overflow: hidden;
}

.photo {
  width: 145px;
  height: 145px;
  margin: 0 auto 8px;
  border-radius: 50%;
  object-fit: cover;
  border: 6px solid #fff;
  box-shadow: 0 5px 18px rgba(255, 120, 150, .28);
  background: #e9f8ff;
}

.speech {
  display: inline-block;
  background: #fff;
  border: 2px solid #ffd1df;
  border-radius: 22px;
  padding: 9px 18px;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 7px;
}

.greeting {
  font-size: 38px;
  line-height: 1.2;
  font-weight: 1000;
  color: #f05a7e;
  text-shadow: 0 2px 0 #fff;
  margin: 5px 0 14px;
}

/* =========================
   日付・天気
========================= */

.info-card {
  background: #fff;
  border-radius: 20px;
  padding: 13px;
  margin-top: 10px;
  box-shadow: 0 4px 12px rgba(80, 80, 80, .08);
}

.date {
  font-size: 25px;
  font-weight: 900;
}

.weather {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 22px;
  font-weight: 800;
}

.weather-icon {
  font-size: 48px;
}

.encourage {
  font-size: 18px;
  font-weight: 700;
  margin-top: 8px;
}

/* =========================
   START
========================= */

.start-button {
  width: 100%;
  margin-top: 16px;
  border: 0;
  border-radius: 50px;
  padding: 18px;
  background: linear-gradient(135deg, #ff6f91, #ff4f78);
  color: white;
  font-size: 27px;
  font-weight: 1000;
  box-shadow: 0 7px 16px rgba(255, 80, 120, .25);
}

/* =========================
   質問カード
========================= */

.question-screen {
  margin-top: 18px;
}

.question-card {
  background: rgba(255,255,255,.96);
  border-radius: 28px;
  padding: 20px 15px 18px;
  box-shadow: 0 8px 24px rgba(90,80,80,.12);
  border: 2px solid #ffd8e3;
  text-align: center;
}

.question-icon {
  font-size: 72px;
  margin-bottom: 4px;
}

.question {
  font-size: 34px;
  line-height: 1.35;
  font-weight: 1000;
  margin: 8px 0 20px;
}

/* =========================
   はい・いいえ
========================= */

.answer {
  width: 100%;
  min-height: 82px;
  border: 0;
  border-radius: 50px;
  margin-top: 12px;
  color: white;
  font-size: 32px;
  font-weight: 1000;
  box-shadow: 0 5px 12px rgba(0,0,0,.12);
}

.yes {
  background: linear-gradient(135deg, #ff6688, #f94670);
}

.no {
  background: linear-gradient(135deg, #55aef5, #338ee2);
}

.answer:active,
.start-button:active {
  transform: scale(.98);
}

/* =========================
   安心メッセージ
========================= */

.thanks {
  margin-top: 18px;
  background: linear-gradient(180deg, #fff9fc, #fff);
  border: 2px solid #ffd6e2;
  border-radius: 28px;
  text-align: center;
  padding: 25px 18px;
}

.thanks-title {
  font-size: 34px;
  font-weight: 1000;
  color: #ed6684;
}

.thanks-text {
  font-size: 21px;
  line-height: 1.6;
  font-weight: 800;
}

/* =========================
   デモ用ナビ
========================= */

.demo-note {
  text-align: center;
  font-size: 13px;
  color: #9a8580;
  margin: 18px 0;
}
</style>
</head>

<body>

<div class="app">
<div class="phone">

  <!-- =====================
       朝のトップ画面
  ====================== -->

  <div class="header">
    <div class="header-title">🏠 朝のチェック</div>
    <div class="header-time" id="headerTime">8:00</div>
  </div>

  <section class="welcome">

    <!-- 後で兄貴の写真に差し替え -->
    <img
      class="photo"
      src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400"
      alt="お兄さん">

    <div class="speech">
      おはよう、お母さん 😊
    </div>

    <div class="greeting">
      おはようございます！
    </div>

    <div class="info-card">
      <div class="date" id="dateText">
        9月14日（日）8:00
      </div>
    </div>

    <div class="info-card weather">
      <div class="weather-icon">☀️</div>
      <div>
        今日の天気は<br>
        <strong style="font-size:30px;color:#3999e8;">晴れ</strong> です
      </div>
    </div>

    <div class="encourage">
      今日も元気に過ごしましょうね ❤️
    </div>

    <button class="start-button" onclick="startCheck()">
      はじめる　›
    </button>

  </section>


  <!-- =====================
       質問エリア
  ====================== -->

  <div class="question-screen" id="questionScreen">

    <div class="question-card">

      <div class="question-icon" id="questionIcon">
        🍚
      </div>

      <div class="question" id="questionText">
        朝ごはん<br>食べた？
      </div>

      <button class="answer yes" onclick="answer('はい')">
        😊　はい
      </button>

      <button class="answer no" onclick="answer('いいえ')">
        🙂　いいえ
      </button>

    </div>

  </div>


  <!-- =====================
       完了画面
  ====================== -->

  <div class="thanks" id="thanksScreen" style="display:none;">

    <div class="thanks-title">
      ありがとう！ 💕
    </div>

    <div class="thanks-text">
      回答してくれてありがとう😊<br>
      今日も無理せず<br>
      ゆっくり過ごしてくださいね。
    </div>

    <div style="font-size:65px;margin-top:12px;">
      🌷😊🌷
    </div>

  </div>

  <div class="demo-note">
    UI試作版 / IRON MOM CARE
  </div>

</div>
</div>


<script>

const questions = [
  {
    icon: "🍚",
    text: "朝ごはん<br>食べた？"
  },
  {
    icon: "💊",
    text: "朝の薬は<br>飲んだ？"
  },
  {
    icon: "❤️",
    text: "身体どこか<br>痛いところない？"
  },
  {
    icon: "💧",
    text: "水分補給<br>してる？"
  }
];

let currentQuestion = 0;
let answers = [];


function startCheck() {
  document.getElementById("questionScreen")
    .scrollIntoView({
      behavior: "smooth"
    });
}


function answer(value) {

  answers.push({
    question: questions[currentQuestion].text
      .replace("<br>", " "),
    answer: value
  });

  currentQuestion++;

  if (currentQuestion >= questions.length) {

    document.getElementById("questionScreen")
      .style.display = "none";

    document.getElementById("thanksScreen")
      .style.display = "block";

    document.getElementById("thanksScreen")
      .scrollIntoView({
        behavior: "smooth"
      });

    console.log("回答結果:", answers);

    return;
  }

  document.getElementById("questionIcon").innerHTML =
    questions[currentQuestion].icon;

  document.getElementById("questionText").innerHTML =
    questions[currentQuestion].text;
}


/* =====================
   現在時刻
===================== */

function updateClock() {

  const now = new Date();

  const month = now.getMonth() + 1;
  const day = now.getDate();
  const hour = String(now.getHours()).padStart(2,"0");
  const minute = String(now.getMinutes()).padStart(2,"0");

  const weekdays = [
    "日","月","火","水","木","金","土"
  ];

  const weekday = weekdays[now.getDay()];

  document.getElementById("headerTime").textContent =
    `${hour}:${minute}`;

  document.getElementById("dateText").textContent =
    `${month}月${day}日（${weekday}）${hour}:${minute}`;
}

updateClock();
setInterval(updateClock, 1000);

</script>

</body>
</html>
```
