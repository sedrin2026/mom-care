
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>お母さん 朝のチェック</title>

<style>

/* ==================================================
   基本設定
================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #fff5f8 0%,
      #fffaf7 48%,
      #eefaff 100%
    );

  color: #5b3d35;
}

button {
  font-family: inherit;
  cursor: pointer;
}


/* ==================================================
   アプリ全体
   スマホ画面内に固定
================================================== */

.app {
  width: 100%;
  height: 100dvh;

  padding:
    max(8px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));

  display: flex;
  justify-content: center;
  align-items: stretch;

  overflow: hidden;
}

.phone {
  width: 100%;
  max-width: 480px;
  height: 100%;

  overflow: hidden;
}


/* ==================================================
   共通ヘッダー
================================================== */

.header {
  height: 7%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 5px;
}

.header-title {
  font-size: clamp(18px, 5vw, 24px);
  font-weight: 900;
}

.header-time {
  font-size: clamp(18px, 5vw, 22px);
  font-weight: 900;
}


/* ==================================================
   ホーム画面
================================================== */

#homeScreen {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}

.welcome {
  width: 100%;
  height: 93%;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  background:
    linear-gradient(
      180deg,
      #fff9fb 0%,
      #ffffff 100%
    );

  border-radius: 28px;

  padding:
    2.5%
    3.5%
    2.5%;

  text-align: center;

  box-shadow:
    0 7px 22px rgba(100, 80, 80, .12);

  border: 2px solid #ffd8e3;

  overflow: hidden;
}


/* ==================================================
   兄貴の写真
   四角・角丸バナー
================================================== */

.photo {
  display: block;

  width: 100%;
  height: 26%;

  min-height: 0;

  margin: 0 auto;

  object-fit: cover;

  border-radius: 22px;

  border: 4px solid #ffffff;

  box-shadow:
    0 5px 16px rgba(255, 120, 150, .23);

  background: #e9f8ff;
}


/* ==================================================
   おはようメッセージ
   1行目：おはよう！
   2行目：〇〇〇だよ！
================================================== */

.greeting {
  width: 100%;

  min-height: 19%;

  margin: 1% auto;

  padding: 5px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      #fff0f5,
      #fff9fb
    );

  border: 2px solid #ffcbd9;

  color: #f05278;

  font-size: clamp(27px, 7.5vw, 40px);

  line-height: 1.08;

  font-weight: 1000;

  text-align: center;

  text-shadow:
    0 2px 0 #ffffff;

  box-shadow:
    0 4px 12px rgba(255, 100, 140, .10);
}

.greeting-line {
  display: block;
  width: 100%;
}


/* ==================================================
   日付
================================================== */

.info-card {
  width: 100%;

  background: #ffffff;

  border-radius: 17px;

  padding: 7px 8px;

  box-shadow:
    0 3px 9px rgba(80, 80, 80, .07);
}

.date {
  font-size: clamp(19px, 5.5vw, 25px);
  line-height: 1.15;
  font-weight: 900;
}


/* ==================================================
   天気
================================================== */

.weather {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  font-size: clamp(16px, 4.5vw, 22px);

  font-weight: 800;
}

.weather-icon {
  font-size: clamp(34px, 10vw, 48px);
  line-height: 1;
}

.weather strong {
  font-size: clamp(25px, 7vw, 30px);
  color: #3999e8;
}


/* ==================================================
   応援メッセージ
================================================== */

.encourage {
  font-size: clamp(14px, 4vw, 18px);
  line-height: 1.15;

  font-weight: 700;

  padding: 2px 0;
}


/* ==================================================
   はじめる
   ホーム画面の最下部
================================================== */

.start-button {
  width: 100%;

  min-height: 10%;

  margin: 0;

  border: 0;

  border-radius: 50px;

  padding: 8px;

  background:
    linear-gradient(
      135deg,
      #ff6f91,
      #ff4f78
    );

  color: #ffffff;

  font-size: clamp(22px, 6.5vw, 27px);

  font-weight: 1000;

  box-shadow:
    0 6px 14px rgba(255, 80, 120, .25);
}

.start-button:active {
  transform: scale(.98);
}


/* ==================================================
   質問画面
   1画面固定
================================================== */

.question-screen {
  width: 100%;
  height: 100%;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.question-card {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    rgba(255, 255, 255, .98);

  border-radius: 28px;

  padding:
    5%
    4%;

  box-shadow:
    0 8px 24px rgba(90, 80, 80, .12);

  border: 2px solid #ffd8e3;

  text-align: center;

  overflow: hidden;
}

.question-icon {
  font-size: clamp(55px, 17vw, 78px);

  line-height: 1;

  margin-bottom: 2%;
}

.question {
  width: 100%;

  font-size: clamp(29px, 8.5vw, 36px);

  line-height: 1.25;

  font-weight: 1000;

  margin: 1% 0 4%;
}


/* ==================================================
   はい・いいえ
================================================== */

.answer {
  width: 100%;

  min-height: 17%;

  border: 0;

  border-radius: 50px;

  margin-top: 2.5%;

  color: #ffffff;

  font-size: clamp(27px, 8vw, 32px);

  font-weight: 1000;

  box-shadow:
    0 5px 12px rgba(0, 0, 0, .12);

  transition:
    transform .1s ease;
}

.yes {
  background:
    linear-gradient(
      135deg,
      #ff6688,
      #f94670
    );
}

.no {
  background:
    linear-gradient(
      135deg,
      #55aef5,
      #338ee2
    );
}

.answer:active {
  transform: scale(.98);
}


/* ==================================================
   完了画面
================================================== */

.thanks {
  width: 100%;
  height: 100%;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.thanks-card {
  width: 100%;

  background:
    linear-gradient(
      180deg,
      #fff9fc,
      #ffffff
    );

  border: 2px solid #ffd6e2;

  border-radius: 28px;

  text-align: center;

  padding: 30px 18px;

  box-shadow:
    0 8px 24px rgba(90, 80, 80, .12);
}

.thanks-title {
  font-size: clamp(30px, 9vw, 36px);

  font-weight: 1000;

  color: #ed6684;
}

.thanks-text {
  font-size: clamp(18px, 5.5vw, 22px);

  line-height: 1.5;

  font-weight: 800;

  margin-top: 12px;
}


/* ==================================================
   特に高さの低いスマホ
================================================== */

@media (max-height: 700px) {

  .welcome {
    padding-top: 1.5%;
    padding-bottom: 1.5%;
  }

  .photo {
    height: 23%;
  }

  .greeting {
    min-height: 17%;
    font-size: clamp(25px, 7vw, 34px);
  }

  .info-card {
    padding: 5px 7px;
  }

  .encourage {
    font-size: 13px;
  }

  .start-button {
    min-height: 9%;
    font-size: 22px;
  }

  .question-icon {
    font-size: 58px;
  }

  .question {
    font-size: 28px;
  }

  .answer {
    min-height: 16%;
    font-size: 27px;
  }
}


/* ==================================================
   さらに小さい高さ
================================================== */

@media (max-height: 600px) {

  .photo {
    height: 21%;
  }

  .greeting {
    min-height: 16%;
    font-size: 25px;
  }

  .date {
    font-size: 18px;
  }

  .weather {
    font-size: 15px;
  }

  .weather-icon {
    font-size: 30px;
  }

  .weather strong {
    font-size: 22px;
  }

  .encourage {
    display: none;
  }

  .start-button {
    min-height: 9%;
    font-size: 21px;
  }
}

</style>
</head>


<body>


<div class="app">

<div class="phone">


<!-- ==================================================
     ホーム画面
================================================== -->

<div id="homeScreen">


  <div class="header">

    <div class="header-title">
      🏠 朝のチェック
    </div>

    <div
      class="header-time"
      id="headerTime">

      8:00

    </div>

  </div>


  <section class="welcome">


    <!-- ==================================================
         兄貴の写真
         後で写真を差し替え
    ================================================== -->

    <img
      class="photo"
      src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800"
      alt="お兄さん">


    <!-- ==================================================
         おはようメッセージ
         〇〇〇 ← 後で3文字に差し替え
    ================================================== -->

    <div class="greeting">

      <span class="greeting-line">
        おはよう！
      </span>

      <span class="greeting-line">
        〇〇〇だよ！
      </span>

    </div>


    <!-- ==================================================
         日付
    ================================================== -->

    <div class="info-card">

      <div
        class="date"
        id="dateText">

        9月14日（日）8:00

      </div>

    </div>


    <!-- ==================================================
         天気
    ================================================== -->

    <div class="info-card weather">

      <div class="weather-icon">
        ☀️
      </div>

      <div>

        今日の天気は<br>

        <strong>
          晴れ
        </strong>

        です

      </div>

    </div>


    <!-- ==================================================
         応援メッセージ
    ================================================== -->

    <div class="encourage">

      今日も元気に過ごしましょうね ❤️

    </div>


    <!-- ==================================================
         ホーム画面の最下部
         ここで終了
    ================================================== -->

    <button
      class="start-button"
      onclick="startCheck()">

      はじめる　›

    </button>


  </section>

</div>



<!-- ==================================================
     質問画面
================================================== -->

<div
  class="question-screen"
  id="questionScreen">


  <div class="question-card">


    <div
      class="question-icon"
      id="questionIcon">

      🍚

    </div>


    <div
      class="question"
      id="questionText">

      朝ごはん<br>
      食べた？

    </div>


    <button
      class="answer yes"
      onclick="answer('はい')">

      😊　はい

    </button>


    <button
      class="answer no"
      onclick="answer('いいえ')">

      🙂　いいえ

    </button>


  </div>

</div>



<!-- ==================================================
     完了画面
================================================== -->

<div
  class="thanks"
  id="thanksScreen">


  <div class="thanks-card">


    <div class="thanks-title">

      ありがとう！ 💕

    </div>


    <div class="thanks-text">

      回答してくれてありがとう😊<br>

      今日も無理せず<br>

      ゆっくり過ごしてくださいね。

    </div>


    <div
      style="
        font-size:65px;
        margin-top:12px;
      ">

      🌷😊🌷

    </div>


  </div>

</div>


</div>
</div>



<script>


/* ==================================================
   質問一覧
================================================== */

const questions = [

  {
    icon: "🍚",
    text: "朝ごはん<br>食べた？"
  },

  {
    icon: "💊",
    text: "朝の薬は<br>飲んだ？"
  },

  {
    icon: "❤️",
    text: "身体どこか<br>痛いところない？"
  },

  {
    icon: "💧",
    text: "水分補給<br>してる？"
  },

  {
    icon: "🏃‍♀️",
    text: "軽く運動は<br>した？"
  },

  {
    icon: "🆘",
    text: "何か困ったこと<br>ある？"
  }

];


let currentQuestion = 0;

let answers = [];


/* ==================================================
   「はじめる」
================================================== */

function startCheck() {

  currentQuestion = 0;

  answers = [];


  document
    .getElementById("homeScreen")
    .style.display = "none";


  document
    .getElementById("questionScreen")
    .style.display = "flex";


  showQuestion();

}


/* ==================================================
   質問表示
================================================== */

function showQuestion() {

  const question =
    questions[currentQuestion];


  document
    .getElementById("questionIcon")
    .innerHTML =
    question.icon;


  document
    .getElementById("questionText")
    .innerHTML =
    question.text;

}


/* ==================================================
   はい／いいえ
   押したら次の画面へ
================================================== */

function answer(value) {


  answers.push({

    question:
      questions[currentQuestion]
        .text
        .replace(/<br>/g, " "),

    answer: value

  });


  currentQuestion++;


  if (
    currentQuestion >=
    questions.length
  ) {


    document
      .getElementById("questionScreen")
      .style.display = "none";


    document
      .getElementById("thanksScreen")
      .style.display = "flex";


    console.log(
      "回答結果:",
      answers
    );


    return;

  }


  showQuestion();

}


/* ==================================================
   現在時刻
================================================== */

function updateClock() {

  const now = new Date();


  const month =
    now.getMonth() + 1;

  const day =
    now.getDate();


  const hour =
    String(
      now.getHours()
    ).padStart(2, "0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  const weekdays = [

    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"

  ];


  const weekday =
    weekdays[now.getDay()];


  document
    .getElementById("headerTime")
    .textContent =
    `${hour}:${minute}`;


  document
    .getElementById("dateText")
    .textContent =
    `${month}月${day}日（${weekday}）${hour}:${minute}`;

}


updateClock();


setInterval(
  updateClock,
  1000
);


</script>

</body>
</html>
```
