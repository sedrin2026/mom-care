
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>お母さん 朝のチェック</title>

<style>

/* ==================================================
   基本設定
================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  color: #603d32;

  background:
    linear-gradient(
      180deg,
      #fff7f9 0%,
      #fffdf9 50%,
      #f0fbff 100%
    );
}

button {
  font-family: inherit;
  border: none;
  outline: none;
}


/* ==================================================
   アプリ全体
   画面内固定・スクロール禁止
================================================== */

.app {
  width: 100%;
  height: 100dvh;

  padding:
    max(6px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(6px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));

  overflow: hidden;

  display: flex;
  justify-content: center;
}

.phone {
  width: 100%;
  max-width: 480px;
  height: 100%;

  overflow: hidden;
}


/* ==================================================
   ホーム画面
================================================== */

#homeScreen {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


/* ==================================================
   ヘッダー
================================================== */

.header {
  height: 7%;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 5px;
}

.header-title {
  font-size: clamp(20px, 5.8vw, 28px);
  font-weight: 1000;

  color: #603d32;
}

.header-time {
  font-size: clamp(20px, 5.8vw, 27px);
  font-weight: 1000;

  color: #603d32;
}


/* ==================================================
   ホームメイン
================================================== */

.welcome {
  width: 100%;
  height: 93%;

  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  justify-content: space-between;

  padding:
    1.2%
    2.5%
    1.5%;

  border-radius: 28px;

  background:
    linear-gradient(
      180deg,
      #fffafc 0%,
      #ffffff 100%
    );

  border: 2px solid #ffd8e5;

  box-shadow:
    0 7px 25px rgba(110, 80, 80, .10);

  overflow: hidden;
}


/* ==================================================
   兄貴の写真
   横長・角丸バナー
================================================== */

.photo {
  display: block;

  width: 100%;

  height: 24%;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 24px;

  border: 4px solid #ffffff;

  box-shadow:
    0 5px 15px rgba(255, 115, 150, .22);

  background: #e9f8ff;
}


/* ==================================================
   おはようバナー
   写真との間に少し隙間
================================================== */

.greeting {
  width: 100%;

  height: 22%;

  flex-shrink: 0;

  margin-top: 1.5%;
  margin-bottom: 1%;

  padding: 4px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  border-radius: 25px;

  background:
    linear-gradient(
      135deg,
      #fff1f6 0%,
      #fffafd 100%
    );

  border: 3px solid #ffc6d8;

  box-shadow:
    0 6px 15px rgba(255, 100, 140, .10);
}

.greeting-line {
  display: block;

  width: 100%;

  line-height: 1.05;

  color: #f33e70;

  font-weight: 1000;

  text-align: center;

  text-shadow:
    0 2px 0 #ffffff;
}

.greeting-line:first-child {
  font-size: clamp(34px, 9.5vw, 48px);
}

.greeting-line:last-child {
  font-size: clamp(33px, 9vw, 46px);

  margin-top: 2px;
}


/* ==================================================
   日付
================================================== */

.date-card {
  width: 100%;

  height: 11%;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 4px 8px;

  background: #fffdf7;

  border: 3px solid #ffe5b7;

  border-radius: 20px;

  box-shadow:
    0 4px 10px rgba(120, 90, 60, .07);
}

.date {
  font-size: clamp(22px, 6.5vw, 31px);

  line-height: 1;

  font-weight: 1000;

  color: #5c392d;

  white-space: nowrap;
}


/* ==================================================
   天気
================================================== */

.weather {
  width: 100%;

  height: 16%;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  padding: 4px 8px;

  background: #fffefa;

  border: 3px solid #ffe6bd;

  border-radius: 20px;

  box-shadow:
    0 4px 10px rgba(120, 90, 60, .07);
}

.weather-icon {
  font-size: clamp(42px, 12vw, 58px);

  line-height: 1;
}

.weather-text {
  text-align: center;

  font-size: clamp(18px, 5vw, 25px);

  font-weight: 1000;

  line-height: 1.05;
}

.weather-text strong {
  display: inline-block;

  font-size: clamp(31px, 9vw, 42px);

  color: #168ce8;

  line-height: 1;
}


/* ==================================================
   応援メッセージ
================================================== */

.encourage {
  width: 100%;

  height: 10%;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  font-size: clamp(17px, 5vw, 24px);

  line-height: 1.1;

  font-weight: 1000;

  color: #603d32;
}


/* ==================================================
   はじめるボタン
================================================== */

.start-button {
  width: 100%;

  height: 13%;

  flex-shrink: 0;

  border-radius: 50px;

  color: #ffffff;

  background:
    linear-gradient(
      135deg,
      #ff6d91 0%,
      #ff3f70 100%
    );

  font-size: clamp(27px, 8vw, 38px);

  font-weight: 1000;

  box-shadow:
    0 7px 16px rgba(255, 70, 110, .27);

  text-shadow:
    0 2px 2px rgba(180, 30, 70, .18);

  transition:
    transform .1s ease;
}

.start-button:active {
  transform: scale(.97);
}


/* ==================================================
   質問画面
================================================== */

.question-screen {
  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.question-card {
  width: 100%;
  height: 100%;

  padding:
    5%
    4%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      180deg,
      #fffafd,
      #ffffff
    );

  border-radius: 28px;

  border: 2px solid #ffd6e2;

  box-shadow:
    0 8px 24px rgba(90, 80, 80, .12);

  overflow: hidden;
}


/* ==================================================
   質問アイコン
================================================== */

.question-icon {
  font-size: clamp(60px, 18vw, 90px);

  line-height: 1;

  margin-bottom: 2%;
}


/* ==================================================
   質問本文
================================================== */

.question {
  width: 100%;

  margin:
    1%
    0
    4%;

  font-size: clamp(31px, 9vw, 42px);

  line-height: 1.25;

  font-weight: 1000;

  color: #603d32;
}


/* ==================================================
   回答ボタン
================================================== */

.answer {
  width: 100%;

  height: 17%;

  flex-shrink: 0;

  margin-top: 3%;

  border-radius: 50px;

  color: #ffffff;

  font-size: clamp(29px, 8.5vw, 38px);

  font-weight: 1000;

  box-shadow:
    0 6px 13px rgba(0, 0, 0, .12);

  transition:
    transform .1s ease;
}

.answer:active {
  transform: scale(.97);
}

.yes {
  background:
    linear-gradient(
      135deg,
      #ff6688,
      #f84270
    );
}

.no {
  background:
    linear-gradient(
      135deg,
      #55b0f5,
      #328ee0
    );
}


/* ==================================================
   完了画面
================================================== */

.thanks {
  width: 100%;
  height: 100dvh;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.thanks-card {
  width: 100%;

  padding: 30px 15px;

  text-align: center;

  border-radius: 28px;

  background:
    linear-gradient(
      180deg,
      #fff8fb,
      #ffffff
    );

  border: 2px solid #ffd6e2;

  box-shadow:
    0 8px 24px rgba(90, 80, 80, .12);
}

.thanks-title {
  font-size: clamp(35px, 10vw, 46px);

  font-weight: 1000;

  color: #ef5278;
}

.thanks-text {
  margin-top: 14px;

  font-size: clamp(19px, 5.5vw, 25px);

  line-height: 1.5;

  font-weight: 900;
}


/* ==================================================
   小さい高さのスマホ
================================================== */

@media (max-height: 700px) {

  .header {
    height: 6%;
  }

  .welcome {
    height: 94%;

    padding-top: 1%;
    padding-bottom: 1%;
  }

  .photo {
    height: 22%;
  }

  .greeting {
    height: 20%;
  }

  .greeting-line:first-child {
    font-size: clamp(29px, 8vw, 39px);
  }

  .greeting-line:last-child {
    font-size: clamp(28px, 7.8vw, 38px);
  }

  .date-card {
    height: 11%;
  }

  .date {
    font-size: clamp(19px, 5.5vw, 25px);
  }

  .weather {
    height: 16%;
  }

  .weather-icon {
    font-size: 38px;
  }

  .weather-text {
    font-size: 16px;
  }

  .weather-text strong {
    font-size: 29px;
  }

  .encourage {
    height: 8%;
    font-size: 15px;
  }

  .start-button {
    height: 12%;
    font-size: 26px;
  }
}


/* ==================================================
   とても小さい画面
================================================== */

@media (max-height: 600px) {

  .photo {
    height: 20%;
  }

  .greeting {
    height: 19%;
  }

  .greeting-line:first-child {
    font-size: 27px;
  }

  .greeting-line:last-child {
    font-size: 26px;
  }

  .date-card {
    height: 11%;
  }

  .date {
    font-size: 18px;
  }

  .weather {
    height: 15%;
  }

  .weather-icon {
    font-size: 30px;
  }

  .weather-text {
    font-size: 13px;
  }

  .weather-text strong {
    font-size: 23px;
  }

  .encourage {
    display: none;
  }

  .start-button {
    height: 12%;
    font-size: 23px;
  }

  .question-icon {
    font-size: 55px;
  }

  .question {
    font-size: 28px;
  }

  .answer {
    height: 16%;
    font-size: 27px;
  }
}

</style>
</head>


<body>


<div class="app">

<div class="phone">


<!-- ==================================================
     ホーム画面
================================================== -->

<div id="homeScreen">


  <!-- ヘッダー -->

  <div class="header">

    <div class="header-title">
      🏠 朝のチェック
    </div>

    <div
      class="header-time"
      id="headerTime">

      8:00

    </div>

  </div>


  <!-- メイン -->

  <section class="welcome">


    <!-- ==================================================
         兄貴の写真
         後でここを自分の写真に差し替え
    ================================================== -->

    <img
      class="photo"
      src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=900"
      alt="お兄さん">


    <!-- ==================================================
         おはようバナー
         〇〇〇 ← ここを後で3文字に変更
    ================================================== -->

    <div class="greeting">

      <span class="greeting-line">
        おはよう！
      </span>

      <span class="greeting-line">
        〇〇〇だよ！
      </span>

    </div>


    <!-- ==================================================
         日付
    ================================================== -->

    <div class="date-card">

      <div
        class="date"
        id="dateText">

        9月14日（日）8:00

      </div>

    </div>


    <!-- ==================================================
         天気
         現在は仮表示
    ================================================== -->

    <div class="weather">

      <div class="weather-icon">
        ☀️
      </div>

      <div class="weather-text">

        今日の天気は<br>

        <strong>
          晴れ
        </strong>

        です

      </div>

    </div>


    <!-- ==================================================
         応援メッセージ
    ================================================== -->

    <div class="encourage">

      今日も元気に過ごしましょうね ❤️

    </div>


    <!-- ==================================================
         ホーム画面の最後
    ================================================== -->

    <button
      class="start-button"
      onclick="startCheck()">

      ▶ はじめる　›

    </button>


  </section>

</div>



<!-- ==================================================
     質問画面
================================================== -->

<div
  class="question-screen"
  id="questionScreen">


  <div class="question-card">


    <div
      class="question-icon"
      id="questionIcon">

      🍚

    </div>


    <div
      class="question"
      id="questionText">

      朝ごはん<br>
      食べた？

    </div>


    <button
      class="answer yes"
      onclick="answer('はい')">

      😊　はい

    </button>


    <button
      class="answer no"
      onclick="answer('いいえ')">

      🙂　いいえ

    </button>


  </div>

</div>



<!-- ==================================================
     完了画面
================================================== -->

<div
  class="thanks"
  id="thanksScreen">


  <div class="thanks-card">


    <div class="thanks-title">

      ありがとう！ 💕

    </div>


    <div class="thanks-text">

      回答してくれてありがとう😊<br>

      今日も無理せず<br>

      ゆっくり過ごしてくださいね。

    </div>


    <div
      style="
        font-size:65px;
        margin-top:12px;
      ">

      🌷😊🌷

    </div>


  </div>

</div>


</div>
</div>



<script>


/* ==================================================
   質問一覧
================================================== */

const questions = [

  {
    icon: "🍚",
    text: "朝ごはん<br>食べた？"
  },

  {
    icon: "💊",
    text: "朝の薬は<br>飲んだ？"
  },

  {
    icon: "❤️",
    text: "身体どこか<br>痛いところない？"
  },

  {
    icon: "💧",
    text: "水分補給<br>してる？"
  },

  {
    icon: "🏃‍♀️",
    text: "軽く運動は<br>した？"
  },

  {
    icon: "🆘",
    text: "何か困ったこと<br>ある？"
  }

];


let currentQuestion = 0;

let answers = [];


/* ==================================================
   はじめる
================================================== */

function startCheck() {

  currentQuestion = 0;

  answers = [];


  document
    .getElementById("homeScreen")
    .style.display = "none";


  document
    .getElementById("questionScreen")
    .style.display = "flex";


  showQuestion();

}


/* ==================================================
   質問表示
================================================== */

function showQuestion() {

  const question =
    questions[currentQuestion];


  document
    .getElementById("questionIcon")
    .textContent =
    question.icon;


  document
    .getElementById("questionText")
    .innerHTML =
    question.text;

}


/* ==================================================
   はい／いいえ
   押したら即次の質問
================================================== */

function answer(value) {


  answers.push({

    question:
      questions[currentQuestion]
        .text
        .replace(/<br>/g, " "),

    answer: value

  });


  currentQuestion++;


  /* 全質問終了 */

  if (
    currentQuestion >=
    questions.length
  ) {


    document
      .getElementById("questionScreen")
      .style.display = "none";


    document
      .getElementById("thanksScreen")
      .style.display = "flex";


    /*
      現段階では確認用。
      後でFirebase等に接続して
      兄貴のスマホへ送信する。
    */

    console.log(
      "回答結果:",
      answers
    );


    return;

  }


  /* 次の質問 */

  showQuestion();

}


/* ==================================================
   時計
================================================== */

function updateClock() {

  const now = new Date();


  const month =
    now.getMonth() + 1;

  const day =
    now.getDate();


  const hour =
    String(
      now.getHours()
    ).padStart(2, "0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  const weekdays = [

    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"

  ];


  const weekday =
    weekdays[now.getDay()];


  document
    .getElementById("headerTime")
    .textContent =
    `${hour}:${minute}`;


  document
    .getElementById("dateText")
    .textContent =
    `${month}月${day}日（${weekday}）${hour}:${minute}`;

}


updateClock();


setInterval(
  updateClock,
  1000
);

</script>

</body>
</html>
```
